name: CI
on:
  push:
    branches: [main]
  pull_request:

# Pull requests (including from forks) only get read access and no secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build -c release
      - name: Tests (path rules, scanner, cleaner on throwaway files)
        run: swift test
      - name: Benchmark smoke test (read-only)
        run: swift run -c release spacebar-bench --path "$GITHUB_WORKSPACE" --runs 1
