name: CI
on:
  push:
    branches: [main]
  pull_request:

# Pull requests (including from forks) only get read access and no secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build -c release
      - name: Tests (path rules, scanner, cleaner on throwaway files)
        run: swift test
      - name: Benchmark smoke test (read-only)
        run: swift run -c release spacebar-bench --path "$GITHUB_WORKSPACE" --runs 1

  # Opens each main page of a debug build and fails if one comes out blank (a view that stops
  # the window from drawing). Snapshots are kept as an artifact to look at.
  ui:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: UI smoke test
        run: ./scripts/ui-smoke.sh "$RUNNER_TEMP/ui-smoke"
      - name: Keep snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/ui-smoke/*.png
          retention-days: 14
